<text x="440" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7D8590">awb</text>
<g style="animation:k11 20.44s linear infinite;opacity:0"><text x="22" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7D8590">1/2  Install</text><text x="22" y="94" fill="#79C0FF">$</text><text x="38.8" y="94" fill="#E6EDF3">npx @onsager/awb setup</text><rect x="37.8" y="78" width="190.8" height="22" fill="#0D1117" style="animation:k0 20.44s steps(1,end) infinite"/><text x="22" y="116" fill="#E6EDF3" style="animation:k1 20.44s linear infinite;opacity:0">◇  Installed 5 skills</text><text x="22" y="138" fill="#7D8590" style="animation:k2 20.44s linear infinite;opacity:0">   host-ops · orchestrate-harnesses · prompt-for-decisions …</text><text x="22" y="160" fill="#E6EDF3" style="animation:k3 20.44s linear infinite;opacity:0">claude agents: haiku, opus, sonnet</text><text x="22" y="182" fill="#56D364" style="animation:k4 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  Claude hook Agent|Task: applied</tspan></text><text x="22" y="204" fill="#56D364" style="animation:k5 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  Claude hook Bash: applied</tspan></text><text x="22" y="226" fill="#56D364" style="animation:k6 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  Claude hook Stop: applied</tspan></text><text x="22" y="248" fill="#56D364" style="animation:k7 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  instruction template: applied</tspan></text><text x="22" y="270" fill="#56D364" style="animation:k8 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  Claude agent haiku: applied</tspan></text><text x="22" y="292" fill="#56D364" style="animation:k9 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  Claude agent sonnet: applied</tspan></text><text x="22" y="314" fill="#56D364" style="animation:k10 20.44s linear infinite;opacity:0"><tspan fill="#56D364">ok</tspan><tspan fill="#E6EDF3">  Claude agent opus: applied</tspan></text></g>
<g style="animation:k24 20.44s linear infinite;opacity:0"><text x="22" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7D8590">2/2  Inside an agent session, the policy hook steps in</text><text x="22" y="94" fill="#7D8590" font-style="italic" style="animation:k12 20.44s linear infinite;opacity:0"># agent runs a command on local main</text><text x="22" y="116" fill="#79C0FF">$</text><text x="38.8" y="116" fill="#E6EDF3">git commit -am "fix typo"</text><rect x="37.8" y="100" width="216" height="22" fill="#0D1117" style="animation:k13 20.44s steps(1,end) infinite"/><text x="22" y="138" fill="#FF7B72" style="animation:k14 20.44s linear infinite;opacity:0">✗ denied  The local main branch is protected. Use a task branch,</text><text x="22" y="160" fill="#FF7B72" style="animation:k15 20.44s linear infinite;opacity:0">          origin/main, or git switch -c &lt;task&gt; origin/main.</text><text x="22" y="182" fill="#7D8590" font-style="italic" style="animation:k16 20.44s linear infinite;opacity:0"># agent waits on CI by polling</text><text x="22" y="204" fill="#79C0FF">$</text><text x="38.8" y="204" fill="#E6EDF3">gh pr checks 12 --watch</text><rect x="37.8" y="188" width="199.20000000000002" height="22" fill="#0D1117" style="animation:k17 20.44s steps(1,end) infinite"/><text x="22" y="226" fill="#FF7B72" style="animation:k18 20.44s linear infinite;opacity:0">✗ denied  GitHub polling is disabled. Use watch_pull_request …</text><text x="22" y="248" fill="#7D8590" font-style="italic" style="animation:k19 20.44s linear infinite;opacity:0"># agent tries to start an Opus Worker</text><text x="22" y="270" fill="#E3B341">⏺</text><text x="38.8" y="270" fill="#E6EDF3">Agent(subagent_type: opus)</text><rect x="37.8" y="254" width="224.4" height="22" fill="#0D1117" style="animation:k20 20.44s steps(1,end) infinite"/><text x="22" y="292" fill="#E3B341" style="animation:k21 20.44s linear infinite;opacity:0">? asks you  Worker opus at level L3 needs the user's approval for this task.</text><text x="22" y="314" fill="#7D8590" font-style="italic" style="animation:k22 20.44s linear infinite;opacity:0"># agent ends its turn with "Should I also update the docs?"</text><text x="22" y="336" fill="#E3B341" style="animation:k23 20.44s linear infinite;opacity:0">↩ sent back  Re-ask it with AskUserQuestion, recommended option first.</text></g>
</svg>
