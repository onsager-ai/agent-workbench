name: Release

# Push a tag vX.Y.Z matching package.json to publish @onsager/awb to npm.
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored.
# A manual run (workflow_dispatch) does a dry run and never publishes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish --access public
      - name: Dry run
        if: github.event_name != 'push'
        run: npm publish --access public --dry-run
