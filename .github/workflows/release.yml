name: Release

# Publishing a GitHub release vX.Y.Z (which creates the tag) publishes @onsager/awb to npm.
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored.
# A manual run (workflow_dispatch) does a dry run and never publishes.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --access public
      - name: Dry run
        if: github.event_name != 'release'
        run: npm publish --access public --dry-run
