name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
      - name: Prepare authentic v0.2.5 upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          expected=e1c73f5d5f67a6b598e3cde03d4789bd1e011d27
          git fetch --no-tags origin refs/tags/v0.2.5:refs/tags/v0.2.5
          actual="$(git rev-list -n 1 v0.2.5)"
          test "$actual" = "$expected"
          fixture="$RUNNER_TEMP/awb-v0.2.5"
          mkdir -p "$fixture"
          git archive "$actual" skills/workbench-setup | tar -x -C "$fixture"
          echo "AWB_PREVIOUS_SETUP_DIR=$fixture/skills/workbench-setup" >> "$GITHUB_ENV"
      - name: Run retained tests
        run: node --test tests/*.test.mjs
      - name: Verify npm package contents
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm_config_cache="$tmp/npm-cache" npm pack --dry-run --json > "$tmp/pack.json"
          node --input-type=module -e 'import fs from "node:fs"; const files = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].files.map((item) => item.path).sort(); const expected = ["LICENSE", "README.md", "README.zh-CN.md", "bin/awb.mjs", "bin/prune.mjs", "package.json", "skills/workbench-setup/scripts/ops.mjs", "skills/workbench-setup/scripts/thermal"].sort(); if (JSON.stringify(files) !== JSON.stringify(expected)) { console.error({ files, expected }); process.exit(1); }' "$tmp/pack.json"
      - name: Verify skill discovery
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export HOME="$tmp/home"
          mkdir -p "$HOME"
          npm_config_cache="$tmp/npm-cache" npx --yes skills@1.7.4 add "$GITHUB_WORKSPACE" --list | tee "$tmp/available.txt"
          for skill in host-ops manage-lane orchestrate-harnesses prompt-for-decisions review-storybook workbench-setup; do
            grep -F "$skill" "$tmp/available.txt" >/dev/null || {
              echo "skills CLI did not discover $skill" >&2
              exit 1
            }
          done
      - name: Verify project-local copy installation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export HOME="$tmp/home"
          mkdir -p "$HOME"
          project="$tmp/project"
          mkdir -p "$project"

          global_snapshot() {
            for root in "$HOME/.agents" "$HOME/.codex" "$HOME/.claude"; do
              if [ -e "$root" ] || [ -L "$root" ]; then
                find -P "$root" -maxdepth 4 -printf '%y %P %s %T@ %C@ %i\n' | LC_ALL=C sort
              else
                printf 'absent %s\n' "$root"
              fi
            done
            for file in "$HOME/AGENTS.md" "$HOME/CLAUDE.md" "$HOME/.codex/AGENTS.md" "$HOME/.claude/CLAUDE.md"; do
              if [ -e "$file" ] || [ -L "$file" ]; then
                stat -c 'file %n %s %Y %Z %i' "$file"
              else
                printf 'absent %s\n' "$file"
              fi
            done
          }

          global_snapshot > "$tmp/global-before.txt"
          cd "$project"
          npm_config_cache="$tmp/npm-cache" npx --yes skills@1.7.4 add "$GITHUB_WORKSPACE" -a codex -a claude-code --skill '*' --copy -y
          for skill in host-ops manage-lane orchestrate-harnesses prompt-for-decisions review-storybook workbench-setup; do
            installed="$(find "$project" -type f -path "*/$skill/SKILL.md" -print -quit)"
            test -n "$installed" || {
              echo "project install did not create $skill/SKILL.md" >&2
              exit 1
            }
            test ! -L "$installed" || {
              echo "$skill was linked instead of copied" >&2
              exit 1
            }
          done
          global_snapshot > "$tmp/global-after.txt"
          diff -u "$tmp/global-before.txt" "$tmp/global-after.txt"
