# Worker configuration schema. User mappings merge; lists replace wholesale.
version: 2
# Values inherited by every tier unless the tier supplies its own value.
# effort is a native effort string; timeout_s is a positive integer ceiling;
# budget_usd is a positive finite Claude budget target, or null for no cap.
defaults: {effort: medium, timeout_s: 7200, budget_usd: null}
# harness selects the client; model is its native identifier. claude_route routes
# a Codex tier from Claude (null disables that route). opt_in requires explicit
# user choice and excludes the tier from the ladder. weekly_brake_percent sets
# the weekly quota threshold for that tier. budget_usd is Claude-only, or null.
tiers:
  luna: {harness: codex, model: gpt-6-luna, claude_route: onsager/codex/gpt-6-luna}
  haiku: {harness: claude, model: claude-haiku-5-5}
  flash: {harness: codex, model: openrouter/deepseek/deepseek-v4.1-flash-1017, effort: high, claude_route: null, opt_in: true}
  terra: {harness: codex, model: gpt-6.1-terra, claude_route: onsager/codex/gpt-6.1-terra, opt_in: true}
  sonnet: {harness: claude, model: claude-sonnet-5-5}
  sol: {harness: codex, model: gpt-6.1-sol, claude_route: onsager/codex/gpt-6.1-sol, weekly_brake_percent: 100}
  opus: {harness: claude, model: claude-opus-5-5}
# Levels are ordered; tiers are tried in order. start_for permits starting at
# that level for these task kinds. approval: required asks before dispatch.
ladder:
  - {level: L1, tiers: [luna, haiku]}
  - {level: L2, tiers: [sol, sonnet], start_for: [spike, research, architecture]}
  - {level: L3, tiers: [opus], approval: required}
policy:
  # Maximum automatic rework attempts before returning to the Manager.
  max_auto_rework: 2
  # Absolute compaction target and optional native window overrides.
  context: {max_tokens: 300000, gateway_window: 400000, codex_window: null}
# Profiles overlay the merged base config; null deletes a tier.
profiles:
  claude-only:
    tiers: {luna: null, sol: null, terra: null, flash: null}
    ladder:
      - {level: L1, tiers: [haiku]}
      - {level: L2, tiers: [sonnet], start_for: [spike, research, architecture]}
      - {level: L3, tiers: [opus], approval: required}
# Default profile when no select rule matches; null uses the base config.
profile: null
# First matching ancestor path wins, e.g. [{path: ~/work, profile: corporate}].
select: []
